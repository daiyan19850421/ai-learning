services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kb-rag-pg
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_dev_only
    ports:
      - "5432:5432"
    volumes:
      - kb_rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kb_rag_pg_data:
